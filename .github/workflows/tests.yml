name: tests
on:
  push: { branches: [main] }
  pull_request:
jobs:
  # The release gate must stop a vulnerable state (coordination, 14.11.2026):
  # a dry run of ci/release/gate.sh on a deliberately vulnerable lock, and on
  # the real release locks, which must pass.
  release-gate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r ci/release/audit.txt
      - name: a vulnerable lock stops the gate
        run: |
          if sh ci/release/gate.sh -r ci/release/selftest-vulnerable.txt; then
            echo "::error::the release gate let a vulnerable lock through"; exit 1
          fi
      - name: the release locks pass the gate
        run: sh ci/release/gate.sh -r ci/release/runtime.txt -r ci/release/build.txt
  test:
    # Our audience is hybrid: a .NET developer sits in front of Windows. The
    # collector had never run there (order idee-fehlerrueckmeldung-sammler,
    # 15.09.2026) — what breaks on windows-latest is a finding, not a nuisance.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: { python-version: "${{ matrix.python-version }}" }
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      # Failures become check-run annotations (readable without a login,
      # also through the API) — the raw job log is admin-only.
      - shell: bash
        run: |
          set -o pipefail
          pytest -q -p no:cacheprovider 2>&1 | tee pytest-out.txt
      - if: failure()
        shell: bash
        run: |
          # Scheitert schon die Installation, gibt es keine pytest-Ausgabe —
          # dann still bleiben statt einen zweiten, falschen Fehler zu melden.
          [ -f pytest-out.txt ] || { echo "kein pytest-Lauf — der Fehler liegt vor den Tests"; exit 0; }
          grep -E "^(FAILED|ERROR|E   |tests/.*::)" pytest-out.txt | head -40 | while IFS= read -r l; do echo "::error::${l}"; done
