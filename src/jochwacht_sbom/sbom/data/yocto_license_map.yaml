# Yocto licence names that are no SPDX identifier, with the value we write
# and the evidence for it (TR-03183-2 §6.1; coordination, 14.11.2026).
#
# The order of §6.1, applied by licenses.yocto_license_expression
# (coordination after sicherheit-2's review, 14.11.2026):
#   - A current SPDX identifier stays as it is (Yocto & -> AND, | -> OR).
#   - Every other name, a deprecated SPDX identifier and create-spdx's
#     LicenseRef-<name> included, needs an entry here, or it is free text (red):
#   1. tier "spdx": a current SPDX identifier or expression (WITH included),
#      proven by the build's text against the SPDX template (SPDX License List
#      Matching Guidelines); no deprecated identifier in the value;
#   2. tier "scancode": LicenseRef-scancode-<key>, in scancode_license_refs.yaml;
#   3. tier "openembedded": LicenseRef-openembedded-<name>, only for a name of
#      openembedded_common_licenses.yaml (poky meta/files/common-licenses) and
#      only after ScanCode was checked without a matching key.
#   A customer's own licence is never attributed to OpenEmbedded.
#
# Every entry names what it was measured on. A new entry needs the same:
# the build's licence text (deploy/licenses/<recipe>/generic_<name>, which
# is common-licenses/<name>), its sha256, and the comparison.
spdx_license_list_version: "3.28.0"
scancode_licensedb_commit: "f10c818a2fbf0cd57a7c1b6cadd86a863408183c"
entries:
  "bzip2-1.0.4":
    tier: scancode
    value: "LicenseRef-scancode-bzip2-libbzip-1.0.4"
    evidence: >-
      Build text deploy/licenses/busybox/generic_bzip2-1.0.4 (Yocto kirkstone,
      sha256 9491498bec823e515e401edad444db14c48fee32d64a5c5be9c1e3f3357921d6)
      is equal, after case, whitespace, quote and separator-line
      normalisation, to the ScanCode text of key bzip2-libbzip-1.0.4
      (1724 characters each). It does not match the SPDX 3.28.0 template of
      bzip2-1.0.6: the attribution line reads "Julian Seward, Cambridge, UK."
      where the template has no variable. bzip2-1.0.5 is deprecated in 3.28.0.
      Control: the build's generic_bzip2-1.0.6 matches the bzip2-1.0.6 template.
  "PD":
    tier: scancode
    value: "LicenseRef-scancode-public-domain"
    evidence: >-
      common-licenses/PD holds no licence text, only "This is a placeholder for
      the Public Domain License" (deploy/licenses/pixman/generic_PD, 52 bytes),
      so no SPDX template can match; SPDX lists no public-domain identifier.
      ScanCode key public-domain is the statement the name makes.
  "CLOSED":
    tier: scancode
    value: "LicenseRef-scancode-proprietary-license"
    evidence: >-
      LICENSE = "CLOSED" marks closed-source code in OpenEmbedded; such a
      recipe needs no LIC_FILES_CHKSUM (Yocto reference manual, LICENSE /
      LIC_FILES_CHKSUM), so there is no licence text to compare. ScanCode key
      proprietary-license; decision of the coordination, 14.11.2026.

